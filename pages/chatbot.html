<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат Бот — Центр ИИ-инноваций</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/chatbot.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <nav class="navbar container">
      <div class="brand">
        <div class="brand-left">
          <div class="brand-logo">
            <img src="../pic/logo-texel.png" alt="Texel logo" class="brand-logo-img" />
          </div>
          <div class="brand-text">
            <div class="texel-word">TEXEL</div>
            <div class="brand-subtitle">Центр ИИ-инноваций</div>
          </div>
        </div>
      </div>

      <ul class="nav-links">
        <li><a href="../index.html#home">Главная</a></li>
        <li><a href="guides.html">Методички</a></li>
        <li><a href="articles.html">Статьи</a></li>
        <li><a href="practices.html">Практики</a></li>
        <li><a href="chatbot.html">Чат Бот</a></li>
        <li class="favorites-nav-item" style="display:none;"><a href="favorites.html">Избранное</a></li>
      </ul>

      <button class="burger-btn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>

      <button class="profile-icon" id="profileBtn">
        <span class="profile-initial">👤</span>
      </button>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <section class="chat-area">
      <div class="chat-container container">
        
        <!-- Боковая панель с историей чатов -->
        <aside class="chat-sidebar">
          <div class="sidebar-header">
            <h3 class="sidebar-title">История чатов</h3>
            <button class="new-chat-btn" id="newChatBtn" title="Новый чат">
              <span class="new-chat-icon">+</span>
            </button>
          </div>
          
          <div class="chat-list" id="chatList">
            <!-- Чаты будут добавляться сюда динамически -->
          </div>
          
          <div class="sidebar-footer">
            <button class="change-key-btn" id="changeKeyBtn" onclick="changeApiKey()">
              🔑 Сменить API-ключ
            </button>
            <button class="clear-history-btn" id="clearHistoryBtn">
              🗑️ Очистить историю
            </button>
          </div>
        </aside>

        <!-- Основное окно чата -->
        <div class="chat-wrapper">
          <div class="chat-window">
            <!-- Сообщения -->
            <div class="chat-messages">
              <!-- Сообщения добавляются динамически -->
            </div>

            <!-- Поле ввода -->
            <div class="chat-input-bar">
              <input
                class="chat-input"
                type="text"
                placeholder="Спроси про ИИ, методички или промт-дизайн…"
                disabled
              />
              <button class="chat-stop-btn" id="stopBtn" style="display: none;">
                ⏸️ Остановить
              </button>
              <button class="chat-send-btn" disabled>Отправить</button>
            </div>

            <div class="chat-hint">
              ✨ Чат работает! Задавай вопросы
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-inner container">
      <div class="footer-left">
        © 2026 Центр ИИ-инноваций
      </div>
      <div class="footer-right">
        <a href="../index.html#home">Главная</a>
        <span class="dot">·</span>
        <a href="guides.html">Методички</a>
        <span class="dot">·</span>
        <a href="../index.html#articles">Статьи</a>
        <span class="dot">·</span>
        <a href="practices.html">Практики</a>
        <span class="dot">·</span>
        <a href="chatbot.html">Чат Бот</a>
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
