<script>
(function() {
  // Получаем ID статьи из URL: article.html?id=foo
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');

  var titleEl = document.getElementById('articleTitle');
  var leadEl = document.getElementById('articleLead');
  var badgeEl = document.getElementById('articleBadge');
  var contentEl = document.getElementById('articleContent');

  function showArticle(a) {
    if (!a) {
      titleEl.textContent = 'Статья не найдена';
      leadEl.textContent = '';
      contentEl.innerHTML = '<p>К сожалению, статья с таким ID не существует.</p>' +
                            '<p><a href="articles.html" class="article-btn">← Вернуться к списку</a></p>';
      document.title = 'Статья не найдена — TEXEL';
      return;
    }

    document.title = (a.headline || 'Статья') + ' — TEXEL';
    titleEl.textContent = a.headline || '';
    leadEl.textContent = a.description || '';
    if (a.badgeClass) badgeEl.classList.add(a.badgeClass);
    badgeEl.textContent = a.badge || 'Статья';
    contentEl.innerHTML = a.content || '<p style="opacity:.6">У этой статьи пока нет полного текста.</p>';
  }

  function findArticle(list, id) {
    if (!Array.isArray(list)) return null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  if (!id) {
    showArticle(null);
    return;
  }

  // 1) Пробуем localStorage (instant)
  var foundLocal = null;
  try {
    var raw = localStorage.getItem('texel_admin_articles');
    if (raw) foundLocal = findArticle(JSON.parse(raw), id);
  } catch (e) {}

  if (foundLocal) showArticle(foundLocal);

  // 2) Затем Firestore (свежие данные с других устройств)
  if (typeof firebase !== 'undefined' && firebase.firestore) {
    try {
      if (!firebase.apps.length && typeof firebaseConfig !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
      }
      var db = firebase.firestore();
      db.collection('admin_data').doc('articles').get()
        .then(function(doc) {
          if (!doc.exists) {
            if (!foundLocal) showArticle(null);
            return;
          }
          var arr = doc.data().data || [];
          // Кэшируем для следующего раза
          try { localStorage.setItem('texel_admin_articles', JSON.stringify(arr)); } catch(e) {}
          var fresh = findArticle(arr, id);
          if (fresh) showArticle(fresh);
          else if (!foundLocal) showArticle(null);
        })
        .catch(function(err) {
          console.warn('Firestore fetch article failed:', err);
          if (!foundLocal) showArticle(null);
        });
    } catch (e) {
      if (!foundLocal) showArticle(null);
    }
  } else {
    if (!foundLocal) showArticle(null);
  }
})();
</script>
</body>
