<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — TEXEL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
  <nav class="navbar container">
    <div class="brand">
      <div class="brand-left">
        <div class="brand-logo">
          <img src="pic/logo-texel.png" alt="Texel logo" class="brand-logo-img" />
        </div>
        <div class="brand-text">
          <div class="texel-word">TEXEL</div>
          <div class="brand-subtitle">Центр ИИ-инноваций</div>
        </div>
      </div>
    </div>

    <ul class="nav-links">
      <li><a href="index.html#home">Главная</a></li>
      <li><a href="guides.html">Методички</a></li>
      <li><a href="articles.html">Статьи</a></li>
      <li><a href="practices.html">Практики</a></li>
      <li><a href="chatbot.html">Чат Бот</a></li>
      <li class="favorites-nav-item" style="display:none;"><a href="favorites.html">Избранное</a></li>
    </ul>

    <button class="burger-btn" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>

    <button class="profile-icon" id="profileBtn">
      <span class="profile-initial">👤</span>
    </button>
  </nav>
</header>

  <main>
    <div class="profile-page" id="profilePage">

      <!-- HERO -->
      <section class="profile-hero">
        <div class="container">
          <div class="profile-hero-inner">
            <div class="profile-avatar" id="profileAvatarBig">U</div>
            <h1 class="profile-user-name" id="profileUserName">Пользователь</h1>
            <p class="profile-user-email" id="profileUserEmail"></p>
          </div>
        </div>
      </section>

      <!-- ПРОГРЕСС -->
      <section class="profile-section">
        <div class="container">
          <h2 class="profile-section-title">Прогресс по темам</h2>
          <div class="profile-progress-grid" id="progressGrid"></div>
        </div>
      </section>

      <!-- ТИТУЛЫ -->
      <section class="profile-section">
        <div class="container">
          <h2 class="profile-section-title">Титулы</h2>
          <div class="profile-titles-grid" id="titlesGrid"></div>
        </div>
      </section>

      <!-- ДОСТИЖЕНИЯ -->
      <section class="profile-section" style="padding-bottom: 4rem;">
        <div class="container">
          <h2 class="profile-section-title">Достижения</h2>
          <div class="profile-achievements-grid" id="achievementsGrid"></div>
        </div>
      </section>

    </div>
  </main>

  <button class="scroll-top-btn" aria-label="Наверх">↑</button>

  <footer class="footer">
    <div class="footer-inner container">
      <div class="footer-left">© 2026 Центр ИИ-инноваций</div>
      <div class="footer-right">
        <a href="index.html#home">Главная</a>
        <span class="dot">·</span>
        <a href="guides.html">Методички</a>
        <span class="dot">·</span>
        <a href="articles.html">Статьи</a>
        <span class="dot">·</span>
        <a href="practices.html">Практики</a>
        <span class="dot">·</span>
        <a href="chatbot.html">Чат Бот</a>
      </div>
    </div>
  </footer>

  <script src="main.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="auth-guard.js"></script>
  <script src="profile.js"></script>
</body>
</html>
